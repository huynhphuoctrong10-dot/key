 <script>
    // 👉 ĐIỀN LINK RÚT GỌN (LINK4M) CỦA BẠN VÀO ĐÂY:
    const LINK4M_URL = "https://link4m.co/AbCd123"; 

    const SECRET = "TRONGMODS_SECRET_KEY";
    const urlParams = new URLSearchParams(window.location.search);
    const now = new Date().getTime();

    // 1. NẾU VỪA TỪ LINK4M NHẢY VỀ (Có kèm mã pass)
    if (urlParams.get("pass") === "tmg2026") {
        // Cấp vé có hiệu lực trong vòng 3 phút (3 * 60 * 1000 ms)
        let expireTokenTime = now + (3 * 60 * 1000); 
        localStorage.setItem("link4m_ticket", expireTokenTime);
        
        // Xóa sạch chữ ?pass=tmg2026 trên thanh URL để chống copy link lưu bookmark
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // 2. KIỂM TRA XEM VÉ CÒN HẠN KHÔNG (Chỉ tồn tại trong 3 phút sau khi vượt link)
    let ticketExpiry = localStorage.getItem("link4m_ticket");
    if (ticketExpiry && now < parseInt(ticketExpiry)) {
        // Vé còn hạn -> Mở khóa giao diện nhập HWID
        document.getElementById("lockSection").classList.add("hidden");
        document.getElementById("unlockSection").classList.remove("hidden");
    } else {
        // Hết 3 phút hoặc chưa vượt link -> Khóa cứng lại!
        document.getElementById("lockSection").classList.remove("hidden");
        document.getElementById("unlockSection").classList.add("hidden");
    }

    function goToLink4M() {
        window.location.href = LINK4M_URL;
    }

    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return Math.abs(hash).toString(36).toUpperCase();
    }

    function generateKey() {
        let hwid = document.getElementById("hwidInput").value.trim();
        if(!hwid || hwid.length < 5) {
            alert("Vui lòng nhập đúng HWID từ app!");
            return;
        }

        let expiryTime = now + (4 * 60 * 60 * 1000); // Key app có hạn 4 tiếng
        
        let rawData = expiryTime + "_" + hwid + "_" + SECRET;
        let signature = simpleHash(rawData);

        let finalKey = "TMG-" + expiryTime.toString(36).toUpperCase() + "-" + hwid.substring(0, 5) + "-" + signature;
        document.getElementById("keyDisplay").innerText = finalKey;
    }

    function copyKey() {
        let keyText = document.getElementById("keyDisplay": document.getElementById("keyDisplay").innerText); // fix typo
        let keyDisplay = document.getElementById("keyDisplay").innerText;
        if(keyDisplay.startsWith("TMG-")) {
            navigator.clipboard.writeText(keyDisplay);
            alert("Đã sao chép key độc quyền!");
        } else {
            alert("Bạn chưa tạo key!");
        }
    }
</script>
