<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMG Admin - Key Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        .admin-badge { background: #ff9800; color: #000; font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 12px; letter-spacing: 1px; }
        h2 { color: #00e676; margin-bottom: 8px; }
        p.subtitle { font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #bbb; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background-color: #2a2a2a; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #00e676; }
        button { width: 100%; padding: 12px; background-color: #00e676; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
        button:hover { background-color: #00c853; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #252525; border-radius: 8px; border: 1px dashed #00e676; display: none; }
        .key-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .key-display { font-size: 18px; font-weight: bold; color: #00e676; letter-spacing: 1px; margin-bottom: 10px; word-break: break-all; }
        .btn-copy { background-color: #333; color: #fff; padding: 8px; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-badge">PANEL ADMIN</div>
        <h2>TMG KEY GENERATOR</h2>
        <p class="subtitle">Tạo Key xác minh tùy chỉnh cho thiết bị</p>

        <div class="input-group">
            <label for="hwid">Mã HWID của máy:</label>
            <input type="text" id="hwid" placeholder="Dán mã HWID vào đây...">
        </div>

        <div class="input-group">
            <label for="expireHours">Thời hạn Key:</label>
            <select id="expireHours">
                <option value="4">4 Tiếng</option>
                <option value="8">8 Tiếng</option>
                <option value="16">16 Tiếng</option>
                <option value="24" selected>24 Tiếng (1 Ngày)</option>
                <option value="72">3 Ngày</option>
                <option value="168">7 Ngày (1 Tuần)</option>
                <option value="720">30 Ngày (1 Tháng)</option>
                <option value="87600">Vĩnh Viễn (10 Năm)</option>
            </select>
        </div>

        <button onclick="processGetKey()">TẠO KEY NGAY</button>

        <div class="result-box" id="resultBox">
            <div class="key-title">KEY CỦA BẠN:</div>
            <div class="key-display" id="keyOutput">---</div>
            <button class="btn-copy" onclick="copyKey()">Sao Chép Key</button>
        </div>
    </div>

    <script>
        // Định dạng thời gian dạng YYYYMMDDHH (Năm-Tháng-Ngày-Giờ)
        function formatDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const hour = String(dateObj.getHours()).padStart(2, '0');
            return `${year}${month}${day}${hour}`;
        }

        function generateKey(hwidValue, hoursToAdd) {
            const secretSalt = "@TMG_Key_2026";
            const expireDate = new Date();
            
            // Cộng thêm số giờ đã chọn
            expireDate.setHours(expireDate.getHours() + parseInt(hoursToAdd));
            const expireStr = formatDate(expireDate);

            // Tạo mã MD5 xác minh
            const rawString = hwidValue + expireStr + secretSalt;
            const hash = CryptoJS.MD5(rawString).toString().substring(0, 8).toUpperCase();

            return `KEY-${expireStr}-${hash}`;
        }

        function processGetKey() {
            const hwidInput = document.getElementById('hwid').value.trim();
            if (!hwidInput) {
                alert('Vui lòng nhập mã HWID!');
                return;
            }

            const hours = document.getElementById('expireHours').value;
            const generatedKey = generateKey(hwidInput, hours);

            document.getElementById('keyOutput').innerText = generatedKey;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyKey() {
            const keyText = document.getElementById('keyOutput').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('Đã sao chép Key thành công!');
            });
        }

        // Tự động điền HWID nếu có tham số ?hwid= trên URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hwidFromUrl = urlParams.get('hwid');
            if (hwidFromUrl) {
                document.getElementById('hwid').value = hwidFromUrl;
                processGetKey();
            }
        });
    </script>

</body>
</html>
